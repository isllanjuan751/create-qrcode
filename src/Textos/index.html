<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./index.css">
    <script src="./app.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QrCode com Textos</title>
</head>
<body>
    <header id="Cabecalho">
        <h1 id="Titulo">QrCode gerador com textos</h1>
    </header>

    <div id="Componentes">
        <div>
            <input type="text" id="saida" placeholder="Saida. ex: 'saida.png'">
        </div>

        <div>
            <button id="btn-gerador">Gerar QrCode Textual</button>
        </div>

        <div>
            <textarea id="Conteudo" placeholder="Seu conteudo/texto aqui"></textarea>
        </div>
    </div>

    <div>
        <button id="btn-voltar">Voltar</button>
    </div>
</body>
</html>
