<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./index.css">
    <script src="./main.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QrCode Links</title>
</head>
<body>
    <header id="cabecalho">
        <h1 id="titulo">QrCode Links</h1>
    </header>

    <div id="Caixa-Links">
        <div>
        <input type="text" id="Saida" placeholder="Saida. Ex: './qrcode.png'">
        </div>
        
        <div>
        <input type="text" id="Link" placeholder="Link. Ex: 'https://google.com'">
        </div>
        
        <div>
        <button id="btn-gerar">Gerar</button>
        </div>
    </div>

    <div>
        <button id="Voltar">Voltar</button>
    </div>
</body>
</html>
